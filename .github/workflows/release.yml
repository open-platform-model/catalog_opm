name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

env:
  # Pinned OPM CLI release used for identity writes and publishing; bump
  # deliberately, never float. The publish pipeline and its gates live there.
  OPM_CLI_VERSION: 'v1.0.0-alpha.11'
  # opm resolves the registry via --registry > OPM_REGISTRY > config file — it
  # does NOT read CUE_REGISTRY. Both are set so any residual cue invocation
  # agrees with opm. opmodel.dev resolves the core dependency and the catalog's
  # own publish target; others fall through to registry.cue.works.
  OPM_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Manifest mode with more than one package emits PER-PACKAGE outputs keyed
    # by the package path ("opm--version"), plus the aggregate paths_released /
    # releases_created. The single-package release_created/tag_name/version
    # outputs do not exist here.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      opm_tag_name: ${{ steps.release.outputs['opm--tag_name'] }}
      opm_version: ${{ steps.release.outputs['opm--version'] }}
      k8s_tag_name: ${{ steps.release.outputs['k8s--tag_name'] }}
      k8s_version: ${{ steps.release.outputs['k8s--version'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install opm
        run: |
          set -euo pipefail
          base="https://github.com/open-platform-model/cli/releases/download/${OPM_CLI_VERSION}"
          curl -fsSLO "${base}/opm-linux-amd64.tar.gz"
          curl -fsSLO "${base}/checksums.txt"
          grep ' opm-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf opm-linux-amd64.tar.gz opm
          sudo install -m 0755 opm /usr/local/bin/opm
          rm -f opm opm-linux-amd64.tar.gz checksums.txt LICENSE

      # Release-please decides the version; the identity file is written only by
      # opm's own writer (enhancement 0011 D3/D15 — no x-release-please-version
      # annotation, which would be a second writer and reintroduce drift). The
      # write is surgical and idempotent, so release-please force-updating its
      # branch just makes this step converge again on the next main push.
      #
      # Each module has its own release PR, its own release branch and its own
      # manifest entry, so this runs once per module and skips the ones with no
      # open branch.
      - name: Advance identity.Version on the release PRs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for m in opm k8s; do
            BRANCH="release-please--branches--main--components--${m}"
            if ! git fetch origin "$BRANCH" 2>/dev/null; then
              echo "${m}: no open release branch - nothing to advance"
              continue
            fi
            git checkout -B "$BRANCH" FETCH_HEAD
            VERSION=$(jq -r --arg m "$m" '.[$m]' .release-please-manifest.json)
            opm catalog version set "$VERSION" "./${m}"
            if git diff --quiet; then
              echo "${m}: identity.Version already declares ${VERSION}"
              continue
            fi
            git add "${m}/identity/identity.cue"
            git commit -m "chore: advance ${m} identity.Version to ${VERSION}"
            git push origin "$BRANCH"
          done

      # A PR created with GITHUB_TOKEN never triggers pull_request workflows,
      # so the required CI check would sit pending forever on the protected
      # main branch. workflow_dispatch events are exempt from that suppression
      # — dispatch CI onto the release branch so the check run lands on the PR
      # head SHA. Runs on every push to main so an updated release PR is
      # re-checked too; if no release branch exists there is nothing to do.
      # Runs after the version advance so the check covers the pushed head.
      - name: Trigger required CI on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for m in opm k8s; do
            gh workflow run ci.yml \
              --repo "${{ github.repository }}" \
              --ref "release-please--branches--main--components--${m}" \
              || echo "${m}: no open release branch - nothing to trigger"
          done

  publish-cue:
    name: Publish ${{ matrix.module }}
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Only the modules release-please actually released this run. Each is a
      # separate CUE module on its own version line, published independently.
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      # Publishing runs here, in the same workflow run that the release-PR
      # merge triggers — NOT from a push:tags trigger. A tag pushed by
      # release-please uses GITHUB_TOKEN, and GitHub suppresses workflow runs
      # for GITHUB_TOKEN-pushed tags, so a tag trigger would never fire.
      - name: Clone the released tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs[format('{0}_tag_name', matrix.module)] }}

      - name: Install opm
        run: |
          set -euo pipefail
          base="https://github.com/open-platform-model/cli/releases/download/${OPM_CLI_VERSION}"
          curl -fsSLO "${base}/opm-linux-amd64.tar.gz"
          curl -fsSLO "${base}/checksums.txt"
          grep ' opm-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf opm-linux-amd64.tar.gz opm
          sudo install -m 0755 opm /usr/local/bin/opm
          rm -f opm opm-linux-amd64.tar.gz checksums.txt LICENSE

      # opm's push path reads the docker credential chain — docker login is the
      # CI credential entry (opm registry login is interactive-only by design).
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # The tagged tree already declares this version (the release PR carried
      # the identity write), so --version is an assertion, not a write: a
      # mismatch is a refusal, never an overwrite. The pipeline publishes the
      # committed tree exactly — no build dir, no version override.
      - name: Publish CUE catalog
        env:
          MODULE: ${{ matrix.module }}
          VERSION: ${{ needs.release-please.outputs[format('{0}_version', matrix.module)] }}
        run: |
          set -euo pipefail
          echo "Publishing ./${MODULE} at v${VERSION}"
          opm catalog publish "./${MODULE}" --version "${VERSION}"

      # Out-of-band verification of the build just pushed — an aid, not a gate
      # (0011 D7): a finding fails the job for visibility, the artifact stays.
      - name: Verify the published build
        env:
          MODULE: ${{ matrix.module }}
          VERSION: ${{ needs.release-please.outputs[format('{0}_version', matrix.module)] }}
        run: |
          set -euo pipefail
          PATH_DECLARED=$(grep -E '^module:' "${MODULE}/cue.mod/module.cue" \
            | sed -E 's/module:[[:space:]]*"(.*)@v[0-9]+"/\1/')
          opm catalog registry check "${PATH_DECLARED}@v${VERSION}" --compat
