name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

env:
  # opm resolves the registry via --registry > OPM_REGISTRY > config file — it
  # does NOT read CUE_REGISTRY. Both are set so any residual cue invocation
  # agrees with opm. opmodel.dev resolves the core dependency and the catalog's
  # own publish target; others fall through to registry.cue.works.
  OPM_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Manifest mode emits PER-PACKAGE outputs keyed by the package PATH, even
    # for a single package: the module lives at src/, so its outputs are
    # "src--release_created", "src--tag_name" and "src--version". The tag
    # and these job outputs carry the component, not the path: opm-vX.Y.Z.
    outputs:
      opm_release_created: ${{ steps.release.outputs['src--release_created'] }}
      opm_tag_name: ${{ steps.release.outputs['src--tag_name'] }}
      opm_version: ${{ steps.release.outputs['src--version'] }}
    steps:
      # A PR opened or pushed with GITHUB_TOKEN holds its CI runs for manual
      # approval. Acting as the release App lets the release PR's CI start on
      # its own.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The identity advance below pushes to the release branch; pushed
          # with GITHUB_TOKEN, that commit's CI would wait for approval.
          token: ${{ steps.app-token.outputs.token }}

      # The opm CLI pin lives in .opm-cli-version only, so a bump never edits a
      # workflow file. The grep refuses a missing, empty or malformed file here,
      # rather than letting Install opm fail later with an unclear 404.
      - name: Read the pinned opm CLI version
        run: |
          grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' .opm-cli-version
          echo "OPM_CLI_VERSION=$(cat .opm-cli-version)" >> "$GITHUB_ENV"

      - name: Install opm
        run: |
          set -euo pipefail
          base="https://github.com/open-platform-model/cli/releases/download/${OPM_CLI_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/opm-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/checksums.txt"
          grep ' opm-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf opm-linux-amd64.tar.gz -C "${tmp}" opm
          sudo install -m 0755 "${tmp}/opm" /usr/local/bin/opm
          rm -rf "${tmp}" opm-linux-amd64.tar.gz checksums.txt

      # task generate:reference below loads the catalog, which resolves
      # opmodel.dev/core@v2 from GHCR: the same read login ci.yml uses.
      - name: Login to GHCR (read deps)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # The site reference under docs/site/reference/ stamps every page with
      # identity.Version, so the identity advance below regenerates it in the
      # same commit; without it the release PR fails its own staleness check.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/refgen/go.mod
          cache-dependency-path: tools/refgen/go.sum

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: 3.x

      # Release-please decides the version; the identity file is written only by
      # opm's own writer (enhancement 0011 D3/D15 — no x-release-please-version
      # annotation, which would be a second writer and reintroduce drift). The
      # write is surgical and idempotent, so release-please force-updating its
      # branch just makes this step converge again on the next main push.
      #
      # The module directory and release-please package path is src; the
      # component, which names the release branch and the tag, is opm.
      - name: Advance identity.Version on the release PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="release-please--branches--main--components--opm"
          if ! git fetch origin "$BRANCH" 2>/dev/null; then
            echo "no open release branch - nothing to advance"
            exit 0
          fi
          git checkout -B "$BRANCH" FETCH_HEAD
          VERSION=$(jq -r '.src' .release-please-manifest.json)
          opm catalog version set "$VERSION" ./src
          task generate:reference
          if git diff --quiet && [ -z "$(git status --porcelain -- docs/site/reference)" ]; then
            echo "identity.Version already declares ${VERSION}"
            exit 0
          fi
          git add src/identity/identity.cue docs/site/reference
          git commit -m "chore: advance opm identity.Version to ${VERSION}"
          git push origin "$BRANCH"

      # A PR created with GITHUB_TOKEN never triggers pull_request workflows,
      # so the required CI check would sit pending forever on the protected
      # main branch. workflow_dispatch events are exempt from that suppression
      # — dispatch CI onto the release branch so the check run lands on the PR
      # head SHA. Runs on every push to main so an updated release PR is
      # re-checked too; if no release branch exists there is nothing to do.
      # Runs after the version advance so the check covers the pushed head.
      - name: Trigger required CI on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref "release-please--branches--main--components--opm" \
            || echo "no open release branch - nothing to trigger"

  publish-cue:
    name: Publish opm
    needs: release-please
    if: needs.release-please.outputs.opm_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # Publishing runs here, in the same workflow run that the release-PR
      # merge triggers — NOT from a push:tags trigger. A tag pushed by
      # release-please uses GITHUB_TOKEN, and GitHub suppresses workflow runs
      # for GITHUB_TOKEN-pushed tags, so a tag trigger would never fire.
      - name: Clone the released tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.opm_tag_name }}

      # Read from the released tag, so the CLI that publishes a release is the
      # one committed in it. The opm CLI pin lives in .opm-cli-version only, so
      # a bump never edits a workflow file. The grep refuses a missing, empty or
      # malformed file here, rather than letting Install opm fail later with an
      # unclear 404.
      - name: Read the pinned opm CLI version
        run: |
          grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' .opm-cli-version
          echo "OPM_CLI_VERSION=$(cat .opm-cli-version)" >> "$GITHUB_ENV"

      - name: Install opm
        run: |
          set -euo pipefail
          base="https://github.com/open-platform-model/cli/releases/download/${OPM_CLI_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/opm-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/checksums.txt"
          grep ' opm-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf opm-linux-amd64.tar.gz -C "${tmp}" opm
          sudo install -m 0755 "${tmp}/opm" /usr/local/bin/opm
          rm -rf "${tmp}" opm-linux-amd64.tar.gz checksums.txt

      # opm's push path reads the docker credential chain — docker login is the
      # CI credential entry (opm registry login is interactive-only by design).
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # The tagged tree already declares this version (the release PR carried
      # the identity write), so --version is an assertion, not a write: a
      # mismatch is a refusal, never an overwrite. The pipeline publishes the
      # committed tree exactly — no build dir, no version override.
      - name: Publish CUE catalog
        env:
          VERSION: ${{ needs.release-please.outputs.opm_version }}
        run: |
          set -euo pipefail
          echo "Publishing ./src at v${VERSION}"
          opm catalog publish ./src --version "${VERSION}"

      # Out-of-band verification of the build just pushed — an aid, not a gate
      # (0011 D7): a finding fails the job for visibility, the artifact stays.
      - name: Verify the published build
        env:
          VERSION: ${{ needs.release-please.outputs.opm_version }}
        run: |
          set -euo pipefail
          PATH_DECLARED=$(grep -E '^module:' src/cue.mod/module.cue \
            | sed -E 's/module:[[:space:]]*"(.*)@v[0-9]+"/\1/')
          opm catalog registry check "${PATH_DECLARED}@v${VERSION}" --compat
