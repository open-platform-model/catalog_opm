name: Release

on:
  push:
    branches:
      - main

# Each job grants exactly what its steps use (the repo default token is
# read-only). Git and PR writes in release-please go through the release App
# token, never GITHUB_TOKEN.
permissions: {}

env:
  # opm resolves the registry via --registry > OPM_REGISTRY > config file — it
  # does NOT read CUE_REGISTRY. Both are set so any residual cue invocation
  # agrees with opm. opmodel.dev resolves the core dependency and the catalog's
  # own publish target; others fall through to registry.cue.works.
  OPM_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # The only job that reads RELEASE_APP_PRIVATE_KEY. Environment release
    # deploys from main only, so no branch workflow can read the key.
    environment: release
    # GITHUB_TOKEN only logs in to GHCR for the fixture gate (packages: read)
    # and dispatches ci.yml onto the release branch (actions: write).
    permissions:
      contents: read
      packages: read
      actions: write
    # Manifest mode emits PER-PACKAGE outputs keyed by the package PATH, even
    # for a single package: the module lives at src/, so its outputs are
    # "src--release_created", "src--tag_name" and "src--version". The tag
    # and these job outputs carry the component, not the path: opm-vX.Y.Z.
    outputs:
      opm_release_created: ${{ steps.release.outputs['src--release_created'] }}
      opm_tag_name: ${{ steps.release.outputs['src--tag_name'] }}
      opm_version: ${{ steps.release.outputs['src--version'] }}
    steps:
      # A PR opened or pushed with GITHUB_TOKEN holds its CI runs for manual
      # approval. Acting as the release App lets the release PR's CI start on
      # its own.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The App token is not left in .git/config while the fixture gate,
          # release-please and the downloaded opm run. Only the identity
          # advance below needs it, and passes it to its own git calls.
          persist-credentials: false

      # The rendered-output fixture gate runs on the pushed main commit BEFORE
      # release-please, which is what pushes the opm-vX.Y.Z tag when a release
      # PR has merged. The release PR passed Validate catalog, but branch
      # protection is not strict and an admin can merge past the check, so the
      # merged tree is checked here too. A failure stops the job before any
      # tag or GitHub Release exists. The merged release PR keeps its
      # `autorelease: pending` label, and release-please tags that PR's merge
      # commit, not HEAD: when the fix lands, the next run would tag the broken
      # tree. Remove the label from the merged release PR before the fix lands,
      # so that version is skipped. publish-cue re-runs this check on the tag
      # as a backstop for when that is missed.
      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.17.1

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: 3.x

      # The fixture exports resolve core from the registry.
      - name: Login to GHCR (read deps)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Check every rendered-output fixture evaluates
        run: task vet:fixtures

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The opm CLI pin lives in .opm-cli-version only, so a bump never edits a
      # workflow file. The grep refuses a missing, empty or malformed file here,
      # rather than letting Install opm fail later with an unclear 404.
      - name: Read the pinned opm CLI version
        run: |
          grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' .opm-cli-version
          echo "OPM_CLI_VERSION=$(cat .opm-cli-version)" >> "$GITHUB_ENV"

      - name: Install opm
        run: |
          set -euo pipefail
          base="https://github.com/open-platform-model/cli/releases/download/${OPM_CLI_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/opm-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/checksums.txt"
          grep ' opm-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf opm-linux-amd64.tar.gz -C "${tmp}" opm
          sudo install -m 0755 "${tmp}/opm" /usr/local/bin/opm
          rm -rf "${tmp}" opm-linux-amd64.tar.gz checksums.txt

      # Release-please decides the version; the identity file is written only by
      # opm's own writer (enhancement 0011 D3/D15 — no x-release-please-version
      # annotation, which would be a second writer and reintroduce drift). The
      # write is surgical and idempotent, so release-please force-updating its
      # branch just makes this step converge again on the next main push.
      # The write is a source edit and resolves nothing, so the step needs no
      # registry login (checked against an unreachable registry, 2026-10-03).
      #
      # The module directory and release-please package path is src; the
      # component, which names the release branch and the tag, is opm.
      #
      # The fetch and push authenticate as the release App, with the token in
      # a per-command header (never in .git/config): pushed with GITHUB_TOKEN,
      # the commit's CI would wait for approval.
      - name: Advance identity.Version on the release PR
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          # Only git gets the token: opm below runs without it in its env.
          unset APP_TOKEN
          app_git() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" "$@"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="release-please--branches--main--components--opm"
          if ! app_git fetch origin "$BRANCH" 2>/dev/null; then
            echo "no open release branch - nothing to advance"
            exit 0
          fi
          git checkout -B "$BRANCH" FETCH_HEAD
          VERSION=$(jq -r '.src' .release-please-manifest.json)
          opm catalog version set "$VERSION" ./src
          if git diff --quiet; then
            echo "identity.Version already declares ${VERSION}"
            exit 0
          fi
          git add src/identity/identity.cue
          git commit -m "chore: advance opm identity.Version to ${VERSION}"
          app_git push origin "$BRANCH"

      # A PR created with GITHUB_TOKEN never triggers pull_request workflows,
      # so the required CI check would sit pending forever on the protected
      # main branch. workflow_dispatch events are exempt from that suppression
      # — dispatch CI onto the release branch so the check run lands on the PR
      # head SHA. Runs on every push to main so an updated release PR is
      # re-checked too; if no release branch exists there is nothing to do.
      # Runs after the version advance so the check covers the pushed head.
      - name: Trigger required CI on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref "release-please--branches--main--components--opm" \
            || echo "no open release branch - nothing to trigger"

  publish-cue:
    name: Publish opm
    needs: release-please
    if: needs.release-please.outputs.opm_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # published is set right after the push, the job's last step, so
    # publish-docs, verify-published and notify-downstream key on it: each runs
    # whenever the module reached GHCR.
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      # Publishing runs here, in the same workflow run that the release-PR
      # merge triggers — NOT from a push:tags trigger. A tag pushed by
      # release-please uses GITHUB_TOKEN, and GitHub suppresses workflow runs
      # for GITHUB_TOKEN-pushed tags, so a tag trigger would never fire.
      - name: Clone the released tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.opm_tag_name }}
          persist-credentials: false

      # Read from the released tag, so the CLI that publishes a release is the
      # one committed in it. The opm CLI pin lives in .opm-cli-version only, so
      # a bump never edits a workflow file. The grep refuses a missing, empty or
      # malformed file here, rather than letting Install opm fail later with an
      # unclear 404.
      - name: Read the pinned opm CLI version
        run: |
          grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' .opm-cli-version
          echo "OPM_CLI_VERSION=$(cat .opm-cli-version)" >> "$GITHUB_ENV"

      - name: Install opm
        run: |
          set -euo pipefail
          base="https://github.com/open-platform-model/cli/releases/download/${OPM_CLI_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/opm-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/checksums.txt"
          grep ' opm-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf opm-linux-amd64.tar.gz -C "${tmp}" opm
          sudo install -m 0755 "${tmp}/opm" /usr/local/bin/opm
          rm -rf "${tmp}" opm-linux-amd64.tar.gz checksums.txt

      # opm's push path reads the docker credential chain — docker login is the
      # CI credential entry (opm registry login is interactive-only by design).
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Backstop for the fixture gate in the release-please job. release-please
      # tags the merge commit of the merged release PR, not HEAD, so a release
      # PR merged onto a tree that failed the gate is tagged by the next run
      # unless its `autorelease: pending` label was removed. Checking the tag
      # here burns that version (tag and Release, no GHCR artifact) instead of
      # publishing the tree the gate refused. On the normal path the gate
      # already passed on this commit, so this step can fail only on a
      # transient registry error (core from GHCR, cue.dev/x/k8s.io from
      # registry.cue.works). The tag and Release exist by then: re-run this
      # job. The first error line under each FAIL names the cause. If the
      # re-run fails on a fixture rather than the registry, the version is
      # burned; see AGENTS.md, Release & publishing (the fix must be a
      # feat/fix/perf/revert commit under src/).
      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.17.1

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: 3.x

      - name: Check every rendered-output fixture evaluates on the tag
        run: task vet:fixtures

      # The tagged tree already declares this version (the release PR carried
      # the identity write), so --version is an assertion, not a write: a
      # mismatch is a refusal, never an overwrite. The pipeline publishes the
      # committed tree exactly — no build dir, no version override.
      - name: Publish CUE catalog
        id: publish
        env:
          VERSION: ${{ needs.release-please.outputs.opm_version }}
        run: |
          set -euo pipefail
          echo "Publishing ./src at v${VERSION}"
          opm catalog publish ./src --version "${VERSION}"
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Out-of-band verification of the build publish-cue just pushed, in its own
  # job so that a finding never fails publish-cue: notify-downstream and
  # publish-docs key on publish-cue's published output and never wait for this
  # job. It reads the registry only, so it holds no write grant.
  verify-published:
    name: Verify the published build
    needs: [release-please, publish-cue]
    if: needs.publish-cue.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Clone the released tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.opm_tag_name }}
          persist-credentials: false

      # Read from the released tag, so the CLI that verifies a release is the
      # one committed in it, the same CLI publish-cue published it with. The
      # grep refuses a missing, empty or malformed file here, rather than
      # letting Install opm fail later with an unclear 404.
      - name: Read the pinned opm CLI version
        run: |
          grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' .opm-cli-version
          echo "OPM_CLI_VERSION=$(cat .opm-cli-version)" >> "$GITHUB_ENV"

      - name: Install opm
        run: |
          set -euo pipefail
          base="https://github.com/open-platform-model/cli/releases/download/${OPM_CLI_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/opm-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/checksums.txt"
          grep ' opm-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf opm-linux-amd64.tar.gz -C "${tmp}" opm
          sudo install -m 0755 "${tmp}/opm" /usr/local/bin/opm
          rm -rf "${tmp}" opm-linux-amd64.tar.gz checksums.txt

      # opm reads registry credentials from the docker credential chain, so
      # docker login is the CI credential entry (opm registry login is
      # interactive-only by design). The token carries packages: read only.
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Out-of-band verification of the build just pushed — an aid, not a gate
      # (0011:D7): a finding fails this job for visibility, the artifact stays.
      - name: Verify the published build
        env:
          VERSION: ${{ needs.release-please.outputs.opm_version }}
        run: |
          set -euo pipefail
          PATH_DECLARED=$(grep -E '^module:' src/cue.mod/module.cue \
            | sed -E 's/module:[[:space:]]*"(.*)@v[0-9]+"/\1/')
          opm catalog registry check "${PATH_DECLARED}@v${VERSION}" --compat

  # The opm docs bundles of the release (docs-kit.cue: catalog-opm and
  # catalog-opm-docs), built from the released tag and published as <version>.0 by docs-kit's publish.yml
  # (docs-kit docs/contracts.md C5). It runs here, in the run the release-PR
  # merge starts, because publish.yml publishes only from refs/heads/main: a
  # `release: published` trigger would run on the tag ref and be refused.
  # It runs only when publish-cue pushed the module (its published output, set
  # right after the push), so the reference never describes a version GHCR
  # does not serve; always() keeps a post-job step that fails publish-cue
  # after the push (a checkout cleanup) from skipping it, and published is
  # only ever true when release-please released opm. It never waits for
  # verify-published. When this job does not run, docs.yml's dispatch
  # publishes the release instead. No version is passed: opm-docs reads it
  # from the tag.
  # The workflow-level permissions carry no id-token; this job grants what
  # publish.yml's release mode needs and nothing more.
  # Once per docs bundle of docs-kit.cue, both from the same release tag:
  # catalog-opm (the Catalogs tab) and catalog-opm-docs (docs/site). fail-fast
  # is off, so one project's failure never cancels the other's publish.
  publish-docs:
    name: Publish the opm docs bundles
    needs: [release-please, publish-cue]
    if: always() && needs.publish-cue.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        project: [catalog-opm, catalog-opm-docs]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.6.0
    with:
      project: ${{ matrix.project }}
      mode: release
      tag: ${{ needs.release-please.outputs.opm_tag_name }}

  # The release cascade (workspace RELEASING.md, "Notify after publish"): tell library,
  # opm-operator and cli that opm-vX.Y.Z is on GHCR. It waits only for the push
  # (published), never for verify-published or publish-docs. This job is
  # caller-owned: it declares environment: cascade and passes the App key only
  # as the private-key input of the SHA-pinned cascade-notify action, its one
  # step; no checkout or run: of its own, no env:, container: or services:.
  # task cascade:wiring:check holds that shape. CASCADE_NOTIFY=off stops it.
  notify-downstream:
    name: Notify downstream
    needs: [release-please, publish-cue]
    if: ${{ !cancelled() && needs.publish-cue.outputs.published == 'true' && vars.CASCADE_NOTIFY != 'off' }}
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Notify downstream
        uses: open-platform-model/.github/.github/actions/cascade-notify@2376ffae4bfc665f327d51581350dea694c01504 # .github main
        with:
          tag: ${{ needs.release-please.outputs.opm_tag_name }}
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
