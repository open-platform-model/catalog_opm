name: Deps cascade

# The release cascade's receiver (workspace RELEASING.md, "The receiver"; Phase 3
# wiring contract §5). It runs task -x deps:cascade through the shared
# cascade-receive workflow in open-platform-model/.github and keeps one rolling
# deps/cascade PR. It accepts payloads from core and cli only (cli moves
# .opm-cli-version, the release-tool edge).
#
# Live only when the repo variable CASCADE_DRY_RUN is exactly false: unset, true
# or anything else is a dry run that computes and summarizes but never pushes.
# A manual run with dry_run, and any run from a ref other than main, are dry runs
# too. gates_only is what Cascade gates sends for a release PR. The caller passes
# no secrets: the reusable publish job declares the cascade Environment itself.
# cue-version is this repo's CUE pin; a CUE bump moves it with the others.

on:
  repository_dispatch:
    types: [upstream-released]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and show the diff in the job summary; push nothing
        type: boolean
        default: false
      gates_only:
        description: Evaluate and post the release-PR gates only (sent by Cascade gates)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.ref != 'refs/heads/main' && format('deps-cascade-{0}', github.ref) || (inputs.gates_only && 'deps-cascade-gates' || 'deps-cascade') }}
  cancel-in-progress: false

jobs:
  cascade:
    name: Deps cascade
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: open-platform-model/.github/.github/workflows/cascade-receive.yml@main
    with:
      dry-run: ${{ inputs.dry_run == true || vars.CASCADE_DRY_RUN != 'false' }}
      gates-only: ${{ inputs.gates_only == true }}
      g2-mode: ${{ vars.CASCADE_G2_MODE || 'warn' }}
      g3-mode: ${{ vars.CASCADE_G3_MODE || 'warn' }}
      setup-go: false
      labels-managed: false
      cue-version: v0.17.1
