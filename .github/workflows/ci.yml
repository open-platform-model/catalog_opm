name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by release.yml onto the release-please branch — a PR created
  # with GITHUB_TOKEN never fires pull_request, so the required check on the
  # protected main branch needs this route.
  workflow_dispatch:

env:
  # vet resolves opmodel.dev/core@v2 and cue.dev/x/k8s.io@v0 from the registry.
  # opmodel.dev -> GHCR; everything else from registry.cue.works. opm reads
  # OPM_REGISTRY (never CUE_REGISTRY); raw cue reads CUE_REGISTRY.
  CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  OPM_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  # Pinned OPM CLI release for the publish-gate dry-run; bump deliberately.
  OPM_CLI_VERSION: 'v1.0.0-alpha.11'

jobs:
  ci:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.17.1

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: 3.x

      - name: Login to GHCR (read deps)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Check CUE formatting
        run: task fmt:check

      - name: Vet CUE catalog
        run: task vet

      - name: Enforce family layering
        run: task vet:layering

      - name: Verify every INDEX.md is up to date
        run: task generate:index:check

      - name: Install opm
        run: |
          set -euo pipefail
          base="https://github.com/open-platform-model/cli/releases/download/${OPM_CLI_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSLO "${base}/opm-linux-amd64.tar.gz"
          curl -fsSLO "${base}/checksums.txt"
          grep ' opm-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf opm-linux-amd64.tar.gz -C "${tmp}" opm
          sudo install -m 0755 "${tmp}/opm" /usr/local/bin/opm
          rm -rf "${tmp}" opm-linux-amd64.tar.gz checksums.txt LICENSE

      # Every publish gate runs, nothing is pushed. On a PR or a push to main
      # the committed version is usually live already, so already-published as
      # the ONLY refusal still passes (the caller-side tolerance from 0011 D15
      # — same pattern as cli's publish-templates.sh); any other refusal fails.
      # On the dispatched release-branch run the version has been advanced, so
      # this is a full GO rehearsal of the next release.
      #
      # Each module is judged on ITS OWN output: the tolerance below keys on a
      # refusal COUNT, so concatenating two modules' runs would let a real
      # refusal in one hide behind an already-published in the other.
      - name: Publish gates dry-run
        run: |
          set -euo pipefail
          rc=0
          for m in opm k8s; do
            echo "::group::publish gates — ${m}"
            if out=$(opm catalog publish "./${m}" --dry-run 2>&1); then
              echo "${out}"
              echo "::endgroup::"
              continue
            fi
            echo "${out}"
            if echo "${out}" | grep -q "already holds" && echo "${out}" | grep -q "1 refusal"; then
              echo "only refusal is already-published - acceptable outside a release"
              echo "::endgroup::"
              continue
            fi
            echo "publish gates refused for ${m}"
            rc=1
            echo "::endgroup::"
          done
          exit $rc
