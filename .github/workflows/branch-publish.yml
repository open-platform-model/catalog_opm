name: Branch publish

on:
  push:
    branches-ignore:
      - main
      # Bot branches never publish dev catalogs: the release cascade's
      # deps/cascade, release-please's release heads and Dependabot's bumps.
      # Their trees are bot-written, so no packages: write token runs them
      # (or a new action SHA) before review.
      - 'deps/**'
      - 'release-please--**'
      - 'dependabot/**'

permissions: {}

# One publish per branch at a time. A branch pushed twice within a second (same
# commit) would start two runs that race to push the same dev tag. Queue, never
# cancel: cancelling a run mid-publish can leave a partial push behind. The
# second run then finds the tag already published and the publish step accepts
# that (see below).
concurrency:
  group: branch-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CUE_VERSION: 'v0.17.1'
  # opm resolves the registry via --registry > OPM_REGISTRY > config file — it
  # does NOT read CUE_REGISTRY. CUE_REGISTRY stays for task check's raw cue
  # invocations. opmodel.dev -> GHCR resolves both the core dependency and the
  # catalog's own dev publish target; others fall through to registry.cue.works.
  OPM_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'
  CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'

jobs:
  publish:
    name: Publish the catalog (dev tag)
    # Forks have no access to GITHUB_TOKEN with packages:write — skip cleanly.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # branch-tag.sh reads the highest stable git tag for the current
          # major; need full history (and tags) for that.
          fetch-depth: 0
          persist-credentials: false

      # The opm CLI pin lives in .opm-cli-version only, so a bump never edits a
      # workflow file. The grep refuses a missing, empty or malformed file here,
      # rather than letting Install opm fail later with an unclear 404.
      - name: Read the pinned opm CLI version
        run: |
          grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' .opm-cli-version
          echo "OPM_CLI_VERSION=$(cat .opm-cli-version)" >> "$GITHUB_ENV"

      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: ${{ env.CUE_VERSION }}

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: 3.x

      # tools/kindgen, the generator of the Kubernetes kind table, is a Go
      # module of its own; task check runs its offline unit tests. No cache:
      # this job publishes, and a restored cache is an input nobody verifies.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/kindgen/go.mod
          cache: false

      - name: Install opm
        run: |
          set -euo pipefail
          base="https://github.com/open-platform-model/cli/releases/download/${OPM_CLI_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/opm-linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 2 "${base}/checksums.txt"
          grep ' opm-linux-amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf opm-linux-amd64.tar.gz -C "${tmp}" opm
          sudo install -m 0755 "${tmp}/opm" /usr/local/bin/opm
          rm -rf "${tmp}" opm-linux-amd64.tar.gz checksums.txt

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # The publish gates do not cover formatting or INDEX freshness — keep the
      # full repo check in front, as the retired publish:branch task did.
      - name: Check catalog
        run: task check

      # branch-tag.sh derives the deterministic -dev version (0011 D15 retains
      # it unchanged). The version is written into the WORKING TREE only — the
      # runner's checkout, never a commit — because publish asserts that the
      # pushed tag equals the tree's own declared Version (D18); a --version
      # flag diverging from the committed release version would be a refusal.
      #
      # branch-tag.sh takes the module directory (src) and the release-please
      # tag prefix it reads releases from (opm-, from the component). The two
      # differ, so neither is derived from the other.
      #
      # A dev tag names its commit (-0.dev.<commit time>.g<sha>), so a tag that
      # is already published came from this same commit in an earlier run of
      # this workflow. When that is the ONLY refusal the module is done, not
      # failed. Any other refusal still fails the job. The count is matched
      # exactly: "11 refusals" must not pass for "1 refusal".
      - name: Publish branch tags
        run: |
          set -euo pipefail
          tag=$(bash .tasks/branch-tag.sh "$(pwd)/src" "opm-")
          echo "publishing opm at ${tag}"
          opm catalog version set "${tag#v}" ./src
          if out=$(opm catalog publish ./src 2>&1); then
            echo "${out}"
          elif echo "${out}" | grep -qF "already holds ${tag}" && echo "${out}" | grep -qE '(^|[^0-9])1 refusal$'; then
            echo "${out}"
            echo "::notice::opm ${tag} is already published from this commit; nothing to do"
          else
            echo "${out}"
            exit 1
          fi
