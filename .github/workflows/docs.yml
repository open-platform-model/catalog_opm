name: Docs

# The catalog-opm docs bundle (docs-kit.cue): the generated catalog reference
# plus the authored pages under docs/catalogs/opm/, built, signed and
# published by docs-kit's reusable publish.yml (docs-kit docs/contracts.md
# C5). opmodel.dev's Catalogs tab pulls it from
# ghcr.io/open-platform-model/docs/catalog-opm.
#
#   pull_request       check: build and lint, publish nothing
#   push to main       edge: publish the commit as the edge build
#   workflow_dispatch  release: the recovery when release.yml's publish-docs
#                      job did not run for an opm release. Only for releases
#                      cut after this repository gained docs-kit.cue: earlier
#                      tags have the module at opm/ and are never backfilled.
#                      revision: a docs revision of a published release. It
#                      applies fix, a single-parent commit on main that changes
#                      only Markdown or only comments, to the release tree and
#                      publishes <version>.<next> (docs-kit README, "Fixing a
#                      release's docs"; docs/contracts.md, "Docs revisions").
#                      Dispatch either on main; publish.yml refuses any other ref:
#                      gh workflow run docs.yml --ref main -f mode=release -f tag=opm-vX.Y.Z
#                      gh workflow run docs.yml --ref main -f mode=revision -f tag=opm-vX.Y.Z -f fix=<40-hex sha>
#
# publish.yml is pinned by docs-kit release tag, never a SHA: the signing
# certificate names it at that ref, and the site trusts only docs-kit's v*
# tags (C5, C9). It runs the opm-docs release named in .opm-docs-version; the
# two pins move together in one PR (task docs:bundle:check refuses a
# mismatch). publish.yml declares no permissions, so each job grants exactly
# what its mode needs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: release (recover a release with no bundle) or revision (fix a published release's docs)
        type: choice
        options: [release, revision]
        default: release
        required: true
      tag:
        description: The opm release tag (opm-vX.Y.Z)
        type: string
        required: true
      # Required by publish.yml in revision mode, which refuses anything but
      # a full 40-hex hash; release mode ignores it, so it cannot be a
      # required input of the dispatch.
      fix:
        description: "revision only: the full 40-hex commit on main to apply"
        type: string
        default: ""

permissions: {}

jobs:
  check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.2.0
    with:
      project: catalog-opm
      mode: check

  edge:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.2.0
    with:
      project: catalog-opm
      mode: edge

  dispatch:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.2.0
    with:
      project: catalog-opm
      mode: ${{ inputs.mode }}
      tag: ${{ inputs.tag }}
      fix: ${{ inputs.fix }}
