version: "3"

# Silent by default — set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

vars:
  # The CUE modules this repo publishes. Each is its own module root with its
  # own cue.mod/, identity/ and catalog.cue; they share only this repo's CI.
  #   opm — opmodel.dev/catalogs/opm@v4, the abstraction catalog
  #   k8s — opmodel.dev/catalogs/k8s@v1, the raw Kubernetes passthrough catalog
  MODULES: opm k8s
  # The Kubernetes release the cue.dev/x/k8s.io pin in opm/cue.mod/module.cue
  # is generated from (v0.12.0: v1.36.0). tools/kindgen reads each kind's
  # scope from this tag's OpenAPI spec; move it with every x/k8s.io bump.
  KUBERNETES_VERSION: v1.36.0

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ## CUE catalogs

  fmt:
    desc: Format all CUE files in every module
    cmds:
      - |
        for m in {{.MODULES}}; do (cd "$m" && cue fmt ./...); done

  fmt:check:
    desc: Verify CUE files are formatted (fails if any file would change)
    cmds:
      - |
        for m in {{.MODULES}}; do (cd "$m" && cue fmt ./...); done
      - |
        set -- {{.MODULES}}
        paths=""
        for m in "$@"; do paths="$paths $m/**/*.cue $m/*.cue"; done
        git diff --exit-code -- $paths

  vet:
    desc: Validate every catalog package
    cmds:
      - |
        set -e
        for m in {{.MODULES}}; do
          echo "vet: $m"
          (cd "$m" && cue vet ./...)
        done

  vet:layering:
    desc: >
      Enforce the family layering rule: the abstraction catalog and the raw
      Kubernetes catalog are separate CUE modules and neither imports the
      other. The module boundary makes this structural; this check keeps an
      import from quietly reintroducing the coupling.
    cmds:
      - |
        # Match IMPORT lines only: an import is a quoted path at the start of a
        # line (bare or aliased). Prose in a doc comment naming the other
        # catalog is not a dependency and must not fail the check.
        check() {
          local here="$1" other="$2"
          local violations
          violations=$(grep -rlnE "^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*[[:space:]]+)?\"opmodel\.dev/catalogs/${other}[/@\"]" \
            "$here" --include='*.cue' 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "Layering violation — the ${here} catalog must not import the ${other} catalog:" >&2
            echo "$violations" >&2
            return 1
          fi
        }
        rc=0
        check k8s opm || rc=1
        check opm k8s || rc=1
        exit $rc

  vet:listing:
    desc: >
      Enforce the listing rule: every contract member filed under
      <module>/<kind>/<apiVersion>/, and every transformer filed flat under
      <module>/transformers/, is a key of that module's catalog.cue #<kind>
      map, and every key names a member. Core validates a listed member; this
      check is what makes the list complete.
    cmds:
      - |
        set -e
        for m in {{.MODULES}}; do bash .tasks/listing.sh "$m"; done

  vet:descriptions:
    desc: >
      Refuse a catalog member without a description: every member of a
      module's #resources, #traits, #blueprints and #transformers maps carries
      a non-blank metadata.description, its one-line summary in the generated
      site reference.
    cmds:
      - |
        set -e
        for m in {{.MODULES}}; do bash .tasks/description-check.sh "$m"; done

  vet:fixtures:
    desc: >
      Check every rendered-output transformer fixture: a fixture is the
      `.output` of a `#transform`, and its golden literal only compares
      something when the field evaluates concretely. `cue vet` (including
      `-c`) does not check hidden fields, so this exports each one.
    cmds:
      - |
        set -e
        for m in {{.MODULES}}; do bash .tasks/fixtures.sh "$m"; done

  tidy:
    desc: Tidy every CUE module manifest
    cmds:
      - |
        set -e
        for m in {{.MODULES}}; do (cd "$m" && cue mod tidy); done

  ## Index generation

  generate:index:
    desc: Regenerate each module's INDEX.md from its CUE definitions
    cmds:
      - |
        set -e
        for m in {{.MODULES}}; do
          bash .tasks/generate-index.sh "$(pwd)/$m" > "$m/INDEX.md"
        done

  generate:index:check:
    desc: Verify every INDEX.md matches generated output (exits non-zero if stale)
    cmds:
      - |
        set -euo pipefail
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        rc=0
        for m in {{.MODULES}}; do
          bash .tasks/generate-index.sh "$(pwd)/$m" > "$tmp"
          if ! diff -q "$m/INDEX.md" "$tmp" >/dev/null 2>&1; then
            echo "FAIL: $m/INDEX.md is out of date — run 'task generate:index'"
            diff "$m/INDEX.md" "$tmp" || true
            rc=1
          else
            echo "OK: $m/INDEX.md is up to date."
          fi
        done
        exit $rc

  ## Site reference
  #
  # tools/refgen (a Go module of its own) loads both catalogs the way `cue
  # vet` does and writes the catalog reference under docs/site/reference/:
  # one page per opm blueprint, resource and trait, and the k8s table.
  # Regenerate after any member or transformer change; release.yml
  # regenerates on the release PR, because every page carries the module's
  # identity.Version.

  generate:reference:
    desc: Regenerate the catalog reference pages under docs/site/reference/ from both catalogs (tools/refgen)
    cmds:
      - go run -C tools/refgen . -repo "$(pwd)"

  generate:reference:check:
    desc: Verify the catalog reference matches both catalogs (exits non-zero if a page is stale or orphaned)
    cmds:
      - go run -C tools/refgen . -repo "$(pwd)" -check

  test:refgen:
    desc: Vet and unit-test the reference generator
    cmds:
      - go vet -C tools/refgen ./...
      - go test -C tools/refgen ./...

  ## Kubernetes kind table
  #
  # tools/kindgen (a Go module of its own) writes opm/schemas/kinds/table.cue,
  # the table the objects resource dispatches on, from the pinned
  # cue.dev/x/k8s.io and the Kubernetes OpenAPI spec of KUBERNETES_VERSION,
  # which it downloads. A maintainer runs it on an x/k8s.io bump; CI does not,
  # and `cue vet` checks the committed table's keys against its schemas.

  generate:kinds:
    desc: Regenerate opm/schemas/kinds/table.cue from the pinned cue.dev/x/k8s.io and the Kubernetes OpenAPI spec (tools/kindgen; needs network)
    cmds:
      - go run -C tools/kindgen . -repo "$(pwd)" -kubernetes {{.KUBERNETES_VERSION}}

  test:kindgen:
    desc: Vet and unit-test the kind table generator
    cmds:
      - go vet -C tools/kindgen ./...
      - go test -C tools/kindgen ./...

  ## Doc comment length

  docs:check:
    desc: Fail on doc comments over 6 lines in every module
    cmds:
      - |
        set -e
        for m in {{.MODULES}}; do bash .tasks/doc-check.sh "$m" --strict; done

  ## Publishing
  #
  # Publishing goes through `opm catalog publish` (enhancement 0011) and is
  # CI-only: release.yml publishes releases, branch-publish.yml publishes
  # -dev.* branch builds. Each module publishes independently. There is
  # deliberately no publish task here — a local publish is a gated exception
  # (Registry Policy rule 2, root AGENTS.md) and requires explicitly pointing
  # opm at the local registry, e.g.
  #   OPM_REGISTRY='opmodel.dev/catalogs=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works' \
  #     opm catalog publish ./opm
  # The pipeline publishes the committed tree exactly and refuses per its gate
  # set; `opm catalog publish ./opm --dry-run` runs every gate without pushing.

  branch-tag:
    desc: "Print a module's branch-publish tag for HEAD (MODULE=opm|k8s; defaults to all)"
    cmds:
      - |
        set -e
        for m in {{.MODULE | default .MODULES}}; do
          printf '%s\t%s\n' "$m" "$(bash .tasks/branch-tag.sh "$(pwd)/$m" "$m-")"
        done

  ## Release

  deps:release-check:
    desc: >
      G1 release-pin gate: fail if either catalog pins a -0.dev. dependency in
      cue.mod/module.cue or tracks a cue.mod/local-module.cue. CI runs it on
      release-please branches; safe to run anywhere.
    cmds:
      - |
        rc=0
        for m in {{.MODULES}}; do
          if grep -nE -- '-0\.dev\.' "$m/cue.mod/module.cue"; then
            echo "G1: $m/cue.mod/module.cue pins a dev build; a release must pin published versions" >&2
            rc=1
          fi
        done
        tracked=$(git ls-files -- '*cue.mod/local-module.cue')
        if [ -n "$tracked" ]; then
          echo "G1: tracked local replacement(s), never shipped in a release:" >&2
          echo "$tracked" >&2
          rc=1
        fi
        exit $rc

  ## Aggregate

  check:
    desc: Format check, vet, layering, listing, descriptions, rendered-output fixtures, INDEX freshness, the generator tests, the generated site reference, and doc-comment report across every module
    cmds:
      - task: fmt:check
      - task: vet
      - task: vet:layering
      - task: vet:listing
      - task: vet:descriptions
      - task: vet:fixtures
      - task: generate:index:check
      - task: test:refgen
      - task: test:kindgen
      - task: generate:reference:check
      - task: docs:check
