version: "3"

# Silent by default — set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ## CUE catalog

  fmt:
    desc: Format all CUE files
    dir: src
    cmds:
      - cue fmt ./...

  fmt:check:
    desc: Verify CUE files are formatted (fails if any file would change)
    cmds:
      - (cd src && cue fmt ./...)
      - git diff --exit-code -- 'src/**/*.cue' 'src/*.cue'

  vet:
    desc: Validate the catalog package
    dir: src
    cmds:
      - cue vet ./...

  vet:layering:
    desc: >
      Enforce the family layering rule (0010 D47): the abstraction family never
      depends on the raw k8s-* family. No trait, blueprint, or non-k8s_
      transformer may reference a k8s-* contract or a #K8s definition.
    cmds:
      - |
        violations=$({ grep -rln '#K8s[A-Z]\|resources/k8s-' src/traits src/blueprints 2>/dev/null; \
          grep -rln '#K8s[A-Z]\|resources/k8s-' src/transformers 2>/dev/null | grep -v '/k8s_'; } || true)
        if [ -n "$violations" ]; then
          echo "Layering violation — abstraction-family files referencing the raw k8s-* family:" >&2
          echo "$violations" >&2
          exit 1
        fi

  tidy:
    desc: Tidy the CUE module manifest
    dir: src
    cmds:
      - cue mod tidy

  ## Index generation

  generate:index:
    desc: Regenerate src/INDEX.md from the CUE definitions
    cmds:
      - bash .tasks/generate-index.sh "$(pwd)" > src/INDEX.md

  generate:index:check:
    desc: Verify src/INDEX.md matches generated output (exits non-zero if stale)
    cmds:
      - |
        set -euo pipefail
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        bash .tasks/generate-index.sh "$(pwd)" > "$tmp"
        if ! diff -q src/INDEX.md "$tmp" >/dev/null 2>&1; then
          echo "FAIL: src/INDEX.md is out of date — run 'task generate:index'"
          diff src/INDEX.md "$tmp" || true
          exit 1
        fi
        echo "OK: src/INDEX.md is up to date."

  ## Publishing
  #
  # Publishing goes through `opm catalog publish` (enhancement 0011) and is
  # CI-only: release.yml publishes releases, branch-publish.yml publishes
  # -dev.* branch builds. There is deliberately no publish task here — a local
  # publish is a gated exception (Registry Policy rule 2, root CLAUDE.md) and
  # requires explicitly pointing opm at the local registry, e.g.
  #   OPM_REGISTRY='opmodel.dev/catalogs=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works' \
  #     opm catalog publish ./src
  # The pipeline publishes the committed tree exactly and refuses per its gate
  # set; `opm catalog publish ./src --dry-run` runs every gate without pushing.

  branch-tag:
    desc: Print the branch-publish tag for HEAD (no side effects)
    cmds:
      - bash .tasks/branch-tag.sh "$(pwd)"

  ## Aggregate

  check:
    desc: Format check, vet, layering, and INDEX freshness
    cmds:
      - task: fmt:check
      - task: vet
      - task: vet:layering
      - task: generate:index:check
