version: "3"

# Silent by default — set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

vars:
  # The one CUE module this repo publishes: opmodel.dev/catalogs/opm@v4. The
  # directory is src; the release-please component and tag prefix stay opm.
  MODULE_DIR: src
  # The Kubernetes release the cue.dev/x/k8s.io pin in src/cue.mod/module.cue
  # is generated from (v0.12.0: v1.36.0). tools/kindgen reads each kind's
  # scope from this tag's OpenAPI spec; move it with every x/k8s.io bump.
  KUBERNETES_VERSION: v1.36.0
  # The docs bundles docs-kit.cue declares: catalog-opm (the Catalogs tab)
  # and catalog-opm-docs (the authored pages under docs/site/).
  DOCS_PROJECTS: catalog-opm catalog-opm-docs

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ## CUE catalogs

  fmt:
    desc: Format all CUE files in the module, and docs-kit.cue
    cmds:
      - (cd "{{.MODULE_DIR}}" && cue fmt ./...)
      - cue fmt docs-kit.cue

  fmt:check:
    desc: Verify CUE files are formatted, docs-kit.cue included (fails if any file would change)
    cmds:
      - (cd "{{.MODULE_DIR}}" && cue fmt ./...)
      - cue fmt docs-kit.cue
      - git diff --exit-code -- '{{.MODULE_DIR}}/**/*.cue' '{{.MODULE_DIR}}/*.cue' docs-kit.cue

  vet:
    desc: >
      Validate every catalog package twice: as a consumer loads it (fixture
      files left out) and with -t fixtures (every fixture file loaded).
    dir: "{{.MODULE_DIR}}"
    cmds:
      - cue vet ./...
      - cue vet -t fixtures ./...

  vet:listing:
    desc: >
      Enforce the listing rule: every contract member filed under
      src/<kind>/<apiVersion>/, and every transformer filed flat under
      src/transformers/, is a key of the catalog.cue #<kind> map, and every
      key names a member. Core validates a listed member; this check is what
      makes the list complete.
    cmds:
      - bash .tasks/listing.sh "{{.MODULE_DIR}}"

  vet:descriptions:
    desc: >
      Refuse a catalog member without a description: every member of the
      #resources, #traits, #blueprints and #transformers maps carries a
      non-blank metadata.description, its one-line summary in the published
      catalog reference (the catalog-opm docs bundle).
    cmds:
      - bash .tasks/description-check.sh "{{.MODULE_DIR}}"

  vet:fixtures:
    desc: >
      Check every rendered-output transformer fixture: a fixture is the
      `.output` of a `#transform`, and its golden literal only compares
      something when the field evaluates concretely. `cue vet` (including
      `-c`) passes a hidden field that stays incomplete, so this exports
      each one, with
      -t fixtures because fixtures live in @if(fixtures) files.
    cmds:
      - bash .tasks/fixtures.sh "{{.MODULE_DIR}}"

  vet:fixtures:tagged:
    desc: >
      Refuse a fixture outside a tagged file: every .cue file in the module
      that declares a top-level _test* field carries @if(fixtures) above its
      package clause, so a plain cue vet (and every consumer) never loads it.
      Text only, offline.
    cmds:
      - bash .tasks/fixture-tags.sh "{{.MODULE_DIR}}"

  tidy:
    desc: Tidy the CUE module manifest
    dir: "{{.MODULE_DIR}}"
    cmds:
      - cue mod tidy

  ## Index generation

  generate:index:
    desc: Regenerate the module's INDEX.md from its CUE definitions
    cmds:
      - bash .tasks/generate-index.sh "$(pwd)/{{.MODULE_DIR}}" > "{{.MODULE_DIR}}/INDEX.md"

  generate:index:check:
    desc: Verify INDEX.md matches generated output (exits non-zero if stale)
    cmds:
      - |
        set -euo pipefail
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        m={{.MODULE_DIR}}
        bash .tasks/generate-index.sh "$(pwd)/$m" > "$tmp"
        if ! diff -q "$m/INDEX.md" "$tmp" >/dev/null 2>&1; then
          echo "FAIL: $m/INDEX.md is out of date — run 'task generate:index'"
          diff "$m/INDEX.md" "$tmp" || true
          exit 1
        fi
        echo "OK: $m/INDEX.md is up to date."

  ## Docs bundle
  #
  # docs-kit.cue declares two docs bundles, both versioned by the opm-v tags:
  # catalog-opm, the catalog reference opm-docs generates from the module plus
  # the authored pages under docs/catalogs/opm/ (the Catalogs tab), and
  # catalog-opm-docs, the authored pages under docs/site/ (placed in /docs/).
  # CI builds, signs and publishes both through docs-kit's publish.yml
  # (docs.yml, release.yml); nothing here commits reference pages. These
  # tasks run the same opm-docs release locally over DOCS_PROJECTS. The
  # release is pinned in .opm-docs-version and in every publish.yml ref, and
  # docs:bundle:check refuses the two disagreeing.

  tools:opm-docs:
    desc: Install or reuse .bin/opm-docs, the checksum-verified docs-kit release named by .opm-docs-version
    cmds:
      - bash .tasks/opm-docs.sh install

  docs:bundle:
    desc: Build each docs bundle (catalog-opm, catalog-opm-docs) of the work tree into out/<project>/ (a local preview of edge)
    deps: [tools:opm-docs]
    cmds:
      - for: {var: DOCS_PROJECTS}
        cmd: .bin/opm-docs build --project {{.ITEM}} --out out

  docs:pins:check:
    desc: Refuse a docs-kit publish.yml ref under .github/workflows/ that names another release than .opm-docs-version (offline)
    cmds:
      - bash .tasks/opm-docs.sh pin-check

  cascade:wiring:check:
    desc: Check the release-cascade caller workflows (Phase 3 wiring contract 10.1)
    cmds:
      - bash .tasks/cascade/wiring-check.sh

  docs:bundle:check:
    desc: Check the docs-kit pins agree once, then build and lint each docs bundle (catalog-opm, catalog-opm-docs) into a temporary directory
    deps: [tools:opm-docs]
    cmds:
      - task: docs:pins:check
      - for: {var: DOCS_PROJECTS}
        cmd: .bin/opm-docs check --project {{.ITEM}}

  ## Kubernetes kind table
  #
  # tools/kindgen (a Go module of its own) writes src/schemas/kinds/table.cue,
  # the table the objects resource dispatches on, from the pinned
  # cue.dev/x/k8s.io and the Kubernetes OpenAPI spec of KUBERNETES_VERSION,
  # which it downloads. A maintainer runs it on an x/k8s.io bump; CI does not,
  # and `cue vet` checks the committed table's keys against its schemas.

  generate:kinds:
    desc: Regenerate src/schemas/kinds/table.cue from the pinned cue.dev/x/k8s.io and the Kubernetes OpenAPI spec (tools/kindgen; needs network)
    cmds:
      - go run -C tools/kindgen . -repo "$(pwd)" -kubernetes {{.KUBERNETES_VERSION}}

  test:kindgen:
    desc: Vet and unit-test the kind table generator
    cmds:
      - go vet -C tools/kindgen ./...
      - go test -C tools/kindgen ./...

  ## Doc comment length

  docs:check:
    desc: Fail on doc comments over 6 lines in the module
    cmds:
      - bash .tasks/doc-check.sh "{{.MODULE_DIR}}" --strict

  ## Publishing
  #
  # Publishing goes through `opm catalog publish` (enhancement 0011) and is
  # CI-only: release.yml publishes releases, branch-publish.yml publishes
  # -dev.* branch builds. There is deliberately no publish task here — a local publish is a gated exception
  # (Registry Policy rule 2, root AGENTS.md) and requires explicitly pointing
  # opm at the local registry, e.g.
  #   OPM_REGISTRY='opmodel.dev/catalogs=localhost:5000+insecure,opmodel.dev=ghcr.io/open-platform-model,registry.cue.works' \
  #     opm catalog publish ./src
  # The pipeline publishes the committed tree exactly and refuses per its gate
  # set; `opm catalog publish ./src --dry-run` runs every gate without pushing.

  branch-tag:
    desc: Print the module's branch-publish tag for HEAD
    cmds:
      # The tag prefix is the release-please component (opm-), not the
      # directory name: releases are tagged opm-vX.Y.Z.
      - bash .tasks/branch-tag.sh "$(pwd)/{{.MODULE_DIR}}" "opm-"

  ## Release

  deps:release-check:
    desc: >
      G1 release-pin gate: fail if the catalog pins a -0.dev. dependency in
      cue.mod/module.cue or tracks a cue.mod/local-module.cue. CI runs it on
      release-please branches; safe to run anywhere.
    cmds:
      - |
        rc=0
        m={{.MODULE_DIR}}
        if grep -nE -- '-0\.dev\.' "$m/cue.mod/module.cue"; then
          echo "G1: $m/cue.mod/module.cue pins a dev build; a release must pin published versions" >&2
          rc=1
        fi
        tracked=$(git ls-files -- '*cue.mod/local-module.cue')
        if [ -n "$tracked" ]; then
          echo "G1: tracked local replacement(s), never shipped in a release:" >&2
          echo "$tracked" >&2
          rc=1
        fi
        exit $rc

  ## Release cascade
  #
  # The repo's half of the release cascade (workspace RELEASING.md, "The cascade";
  # Phase 2 cascade contract §5). Run every one with `task -x` to see the real
  # exit code: 0 moved, 3 nothing to do, anything else an error. Each task but
  # deps:cascade:test finds the shared resolver itself (contract §3):
  # $CASCADE_RESOLVER when set (an absolute path), else the .github checkout
  # beside this repo's main checkout.

  deps:cascade:
    desc: Move core in src/ and .opm-cli-version to the newest published versions (working tree only; exit 0 moved, 3 nothing to do)
    vars: &cascade_resolver
      CASCADE_RESOLVER_PATH:
        sh: |
          if [ -n "${CASCADE_RESOLVER:-}" ]; then
            case "$CASCADE_RESOLVER" in /*) ;; *) echo "CASCADE_RESOLVER must be absolute" >&2; exit 1 ;; esac
            printf '%s\n' "$CASCADE_RESOLVER"; exit 0
          fi
          common=$(git rev-parse --path-format=absolute --git-common-dir) || exit 1
          printf '%s\n' "$(dirname "$common")/../.github/.github/scripts/cascade/cascade-resolve.sh"
    env: &cascade_env
      CASCADE_RESOLVER: '{{.CASCADE_RESOLVER_PATH}}'
    preconditions: &cascade_pre
      - sh: test -x '{{.CASCADE_RESOLVER_PATH}}'
        msg: "cascade resolver not found: check out open-platform-model/.github beside this repo, or set CASCADE_RESOLVER"
    cmds:
      - bash .tasks/cascade/cascade.sh

  deps:cascade:title:
    desc: Print the cascade PR title computed from the diff against the base (exit 3 when there is no diff)
    vars: *cascade_resolver
    env: *cascade_env
    preconditions: *cascade_pre
    cmds:
      - '"$CASCADE_RESOLVER" title --classes .tasks/cascade/classes --pins .tasks/cascade/pins.sh'

  deps:cascade:body:
    desc: Print the cascade PR body (moved pins, triggering releases, warnings, Notes)
    vars: *cascade_resolver
    env: *cascade_env
    preconditions: *cascade_pre
    cmds:
      - '"$CASCADE_RESOLVER" body --classes .tasks/cascade/classes --pins .tasks/cascade/pins.sh'

  # No resolver var: every scenario runs against the repo's own copy of the
  # contract stub, and S5 against CASCADE_RESOLVER_REAL (contract v1.1, C7).
  deps:cascade:test:
    desc: Test deps:cascade in sandbox copies against the contract stub (CASCADE_TEST_SET=offline|all; S5 needs CASCADE_RESOLVER_REAL)
    cmds:
      - bash .tasks/cascade/test.sh

  ## Aggregate

  check:
    desc: Format check, vet, listing, descriptions, rendered-output fixtures, fixture tags, INDEX freshness, the kind table generator tests, the docs bundle check, doc-comment report, and the cascade wiring check
    cmds:
      - task: fmt:check
      - task: vet
      - task: vet:listing
      - task: vet:descriptions
      - task: vet:fixtures
      - task: vet:fixtures:tagged
      - task: generate:index:check
      - task: test:kindgen
      - task: docs:bundle:check
      - task: docs:check
      - task: cascade:wiring:check
